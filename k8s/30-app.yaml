apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: three-s }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: three-s-services:oracle-arm64
          imagePullPolicy: Never
