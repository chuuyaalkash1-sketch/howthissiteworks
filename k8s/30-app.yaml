apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data
  namespace: three-s
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: content-data
  namespace: three-s
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: files-data
  namespace: three-s
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth
  namespace: three-s
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: auth } }
  template:
    metadata: { labels: { app: auth } }
    spec:
      containers:
        - name: auth
          image: three-s-services:oracle-arm64
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SERVICE, value: auth }
            - { name: PORT, value: "8000" }
            - { name: AUTH_DB, value: /data/auth.db }
            - { name: OBSERVABILITY_URL, value: "http://observability:8000" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: three-s-secrets, key: jwt-secret } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: auth-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: auth, namespace: three-s }
spec:
  selector: { app: auth }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: content, namespace: three-s }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: content } }
  template:
    metadata: { labels: { app: content } }
    spec:
      containers:
        - name: content
          image: three-s-services:oracle-arm64
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SERVICE, value: content }
            - { name: PORT, value: "8000" }
            - { name: CONTENT_DATA_DIR, value: /data }
            - { name: OBSERVABILITY_URL, value: "http://observability:8000" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
          volumeMounts: [{ name: data, mountPath: /data }]
      volumes: [{ name: data, persistentVolumeClaim: { claimName: content-data } }]
---
apiVersion: v1
kind: Service
metadata: { name: content, namespace: three-s }
spec:
  selector: { app: content }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: commerce, namespace: three-s }
spec:
  replicas: 1
  selector: { matchLabels: { app: commerce } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: commerce } }
    spec:
      containers:
        - name: commerce
          image: three-s-services:oracle-arm64
          imagePullPolicy: Never
          ports: [{ containerPort: 8000 }]
          env:
            - { name: SERVICE, value: commerce }
            - { name: PORT, value: "8000" }
            - { name: AUTH_URL, value: "http://auth:8000" }
            - { name: OBSERVABILITY_URL, value: "http://observability:8000" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata: { name: commerce, namespace: three-s }
spec:
  selector: { app: commerce }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
