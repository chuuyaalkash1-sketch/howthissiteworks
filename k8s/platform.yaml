apiVersion: v1
kind: Namespace
metadata: {name: three-s}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: platform-config, namespace: three-s}
data:
  AUTH_URL: http://auth:8001
  COMMERCE_URL: http://commerce:8002
  CONTENT_URL: http://content:8003
  OBSERVABILITY_URL: http://observability:8004
---
apiVersion: v1
kind: Secret
metadata: {name: platform-secrets, namespace: three-s}
type: Opaque
stringData: {JWT_SECRET: replace-in-production}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway, namespace: three-s}
spec:
  replicas: 3
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/your-user/three-s-gateway:latest
          ports: [{containerPort: 8000}]
          envFrom: [{configMapRef: {name: platform-config}}]
          readinessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8000}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway, namespace: three-s}
spec: {selector: {app: gateway}, ports: [{port: 80, targetPort: 8000}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: auth, namespace: three-s}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: auth}}
  template:
    metadata: {labels: {app: auth}}
    spec:
      containers:
        - name: auth
          image: ghcr.io/your-user/three-s-auth:latest
          ports: [{containerPort: 8001}]
          env:
            - {name: PORT, value: "8001"}
            - {name: OBSERVABILITY_URL, valueFrom: {configMapKeyRef: {name: platform-config, key: OBSERVABILITY_URL}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: platform-secrets, key: JWT_SECRET}}}
          readinessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8001}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: auth, namespace: three-s}
spec: {selector: {app: auth}, ports: [{port: 8001, targetPort: 8001}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: commerce, namespace: three-s}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: commerce}}
  template:
    metadata: {labels: {app: commerce}}
    spec:
      containers:
        - name: commerce
          image: ghcr.io/your-user/three-s-commerce:latest
          ports: [{containerPort: 8002}]
          env:
            - {name: PORT, value: "8002"}
            - {name: AUTH_URL, valueFrom: {configMapKeyRef: {name: platform-config, key: AUTH_URL}}}
            - {name: OBSERVABILITY_URL, valueFrom: {configMapKeyRef: {name: platform-config, key: OBSERVABILITY_URL}}}
          readinessProbe: {httpGet: {path: /health, port: 8002}, initialDelaySeconds: 3, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8002}, initialDelaySeconds: 10, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: commerce, namespace: three-s}
spec: {selector: {app: commerce}, ports: [{port: 8002, targetPort: 8002}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: content, namespace: three-s}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: content}}
  template:
    metadata: {labels: {app: content}}
    spec:
      containers:
        - name: content
          image: ghcr.io/your-user/three-s-content:latest
          ports: [{containerPort: 8003}]
          env: [{name: PORT, value: "8003"}, {name: OBSERVABILITY_URL, valueFrom: {configMapKeyRef: {name: platform-config, key: OBSERVABILITY_URL}}}]
          readinessProbe: {httpGet: {path: /health, port: 8003}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: content, namespace: three-s}
spec: {selector: {app: content}, ports: [{port: 8003, targetPort: 8003}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: observability, namespace: three-s}
spec:
  replicas: 2
  strategy: {type: RollingUpdate, rollingUpdate: {maxUnavailable: 0, maxSurge: 1}}
  selector: {matchLabels: {app: observability}}
  template:
    metadata: {labels: {app: observability}}
    spec:
      containers:
        - name: observability
          image: ghcr.io/your-user/three-s-observability:latest
          ports: [{containerPort: 8004}]
          env: [{name: PORT, value: "8004"}]
          readinessProbe: {httpGet: {path: /health, port: 8004}, initialDelaySeconds: 3, periodSeconds: 5}
---
apiVersion: v1
kind: Service
metadata: {name: observability, namespace: three-s}
spec: {selector: {app: observability}, ports: [{port: 8004, targetPort: 8004}]}
