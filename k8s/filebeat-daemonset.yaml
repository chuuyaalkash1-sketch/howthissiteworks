apiVersion: v1
kind: ConfigMap
metadata: {name: filebeat-config, namespace: three-s}
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: kubernetes-container-logs
        paths: ["/var/log/containers/*.log"]
        parsers: [{container: {stream: all, format: auto}}]
    processors:
      - add_kubernetes_metadata: {host: ${NODE_NAME}, matchers: [{logs_path: {logs_path: "/var/log/containers/"}}]}
    output.logstash: {hosts: ["logstash:5044"]}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: filebeat, namespace: three-s}
spec:
  selector: {matchLabels: {app: filebeat}}
  template:
    metadata: {labels: {app: filebeat}}
    spec:
      serviceAccountName: default
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.4.2
          args: ["-c", "/etc/filebeat.yml", "-e", "--strict.perms=false"]
          env: [{name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}]
          securityContext: {runAsUser: 0}
          volumeMounts:
            - {name: config, mountPath: /etc/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: varlog, mountPath: /var/log, readOnly: true}
      volumes:
        - {name: config, configMap: {name: filebeat-config}}
        - {name: varlog, hostPath: {path: /var/log}}
